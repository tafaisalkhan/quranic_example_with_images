name: quran_examples
description: Offline, multilingual Quran examples with verified-content boundaries.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  google_mobile_ads: 9.1.0
  in_app_purchase: ^3.3.1
  intl: any
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/data/quran/
    - assets/data/translations/
    - assets/data/legacy/
    - assets/images/examples/
    - assets/audios/
